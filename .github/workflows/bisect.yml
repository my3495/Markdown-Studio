name: CI Bisect D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bisect.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo test-step

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: echo publish-step
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
